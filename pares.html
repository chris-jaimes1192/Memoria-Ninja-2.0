<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontrar Pares ? Ninja Memory</title>
    <link rel="stylesheet" href="css/pares.css">
</head>

<body>

    <audio id="gameMusic" loop>
        <source src="assets/game music.mp3" type="audio/mpeg">
    </audio>

    <video autoplay muted loop playsinline id="videofondo">
        <source src="assets/fondo.mp4" type="video/mp4">
    </video>

    <main class="juego">

        <div id="contador" class="contador"></div>

        <div id="victoriaTexto" class="victoria-texto">
            ?BUEN TRABAJO<br>NINJA!
        </div>

        <section class="panel-principal">

            <!-- TABLERO IZQUIERDO -->
            <section class="tablero tablero-izquierdo" id="tableroIzquierdo"></section>

            <!-- PANEL CENTRAL -->
            <section class="panel-central">

                <div class="panel-info">

                    <div class="estadistica">
                        <h2>PUNTOS</h2>
                        <div class="valor" id="puntaje">0</div>
                    </div>

                    <button class="btn-ajustes" id="btnAjustes">
                        <img src="assets/ajustes.png" alt="Ajustes">
                    </button>

                    <div class="estadistica">
                        <h2>TIEMPO</h2>
                        <div class="valor" id="tiempo">01:00</div>
                    </div>

                </div>

                <div class="acciones">

                    <h1 class="titulo">
                        JUEGA
                    </h1>

                    <a href="men�.html" class="boton">volver</a>

                </div>

            </section>

            <!-- TABLERO DERECHO -->
            <section class="tablero tablero-derecho" id="tableroDerecho"></section>

        </section>

    </main>

    <!-- MODAL: PERDER -->
    <div id="modalPerder" class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloPerder">
        <div class="modal-contenido">
            <h2 id="tituloPerder">??Has perdido!</h2>
            <p>Se acab? el tiempo.</p>
            <button id="reiniciar">Reiniciar</button>
            <button id="men�">Ir al menú</button>
        </div>
    </div>

    <!-- MODAL: GANAR -->
    <div id="modalGanar" class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloGanar">
        <div class="modal-contenido">
            <h2 id="tituloGanar">??Felicidades!</h2>
            <p>Has encontrado todas las parejas.</p>
            <button id="volverJugar">Jugar otra vez</button>
            <button id="volverMenu">Ir al menú</button>
        </div>
    </div>

    <!-- MODAL: AJUSTES -->
    <div id="modalAjustes" class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloAjustes">
        <div class="modal-contenido">
            <h2 id="tituloAjustes">Ajustes</h2>
            <button id="btnMusica">M?sica: ON</button>
            <button id="btnPausa">Pausar partida</button>
            <button id="btnMenuAjustes">Salir al menú</button>
            <button id="btnCerrarAjustes">Cerrar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="js/pares.js"></script>
</body>

</html>
