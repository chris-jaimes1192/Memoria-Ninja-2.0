<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&display=swap" rel="stylesheet">
    <title>Fácil</title>
    <link rel="stylesheet" href="css/facil.css">
</head>
<body>

    <img src="img/akatsuki.png" type="img/png" id="imagenfondo">
    

    <!-- Barra superior -->
    <div class="top-bar">
        <div class="left">
            <img src="img/Reloj.png" class="reloj">
            <span id="timer">40</span>s
        </div>

        <div class="right">
            <img src="img/Pause.png" id="btnPause" class="pause-btn">
        </div>
    </div>

    <!-- Logo -->
    <img src="img/Logo.png" class="logo">

    <!-- Texto -->
    <p class="titulo">Agrupa los objetos según corresponda</p>

    <!-- Contenedor de objetos -->
    <div id="objetosContainer" class="objetos-container"></div>

    <!-- Carpetas -->
    <div class="carpetas">
        <div class="carpeta" id="mitologia">
            <img src="img/Carpeta 1.png" class="carpeta-img">
            <p>Aldea de la roca</p>
        </div>

        <div class="carpeta" id="scifi">
            <img src="img/Carpeta 2.png" class="carpeta-img">
            <p>Akatsuki</p>
        </div>
    </div>

    <!-- Menú de pausa -->
    <div id="pauseMenu" class="pause-menu hidden">
        <div class="pause-box">
            <button id="btnResume">Reanudar</button>
            <button onclick="window.location='../menu.html'">Modo de juego</button>
            <button onclick="window.location='../menu.html'">Salir del juego</button>
        </div>
    </div>

    <!-- Pantalla Final -->
    <div id="finalScreen" class="final-screen hidden">
        <h1 id="finalMessage"></h1>
        <button onclick="location.reload()">Reintentar</button>
        <button onclick="window.location='../menu.html'">Modo de juego</button>
        <button onclick="window.location='../menu.html'">Salir del juego</button>
    </div>

    <script src="js/facil.js"></script>
</body>
</html>
