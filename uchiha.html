<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Juego — Memorice Duel</title>

    <!-- FUENTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/uchiha.css">
    <link rel="stylesheet" href="css/tema-aldea.css">
    <!-- GUARD DE SESIÓN (valida contra el servidor; nunca redirige) -->
    <script src="js/sesion-guard.js"></script>
</head>

<body>
<div class="zona-fit-root"><div class="zona-fit-canvas">

    <!-- ================= MÚSICA ================= -->

    <audio id="gameMusic" loop>
        <source src="assets/game music.mp3" type="audio/mpeg">
    </audio>


    <!-- ================= VIDEO DE FONDO ================= -->

    <video autoplay muted loop playsinline id="videofondo-glow" aria-hidden="true" tabindex="-1" style="position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;object-fit:cover;filter:blur(22px) brightness(.55) saturate(1.1);z-index:-2;pointer-events:none;">
        <source src="assets/fondo.mp4" type="video/mp4">
    </video>
    <video autoplay muted loop playsinline id="videofondo">
        <source src="assets/fondo.mp4" type="video/mp4">
    </video>


    <!-- ================= ESTADÍSTICAS ================= -->

    <div id="stats" class="stats">

        <span>
            Tiempo:
            <span id="timer">00:00</span>
        </span>

        <span>
            Movimientos:
            <span id="moves">0</span>
        </span>

        <span>
            Puntaje:
            <span id="score">0</span>
        </span>

    </div>


    <!-- ================= TABLERO ================= -->

    <div id="boardFrame">

        <div id="board"></div>

    </div>


    <!-- ================= MODAL DE DERROTA ================= -->

    <div id="modal" class="hidden">

        <div class="panel">

            <h2>💀 ¡DERROTA!</h2>

            <h2>
                No pudiste completar el desafío
            </h2>

            <p id="finalStats"></p>

            <div class="botones-modal">

                <button id="restartGame">
                    🔄 Intentar de nuevo
                </button>

                <button id="closeModal">
                    Volver al menú
                </button>

            </div>

        </div>

    </div>


    <!-- ================= MODAL DE VICTORIA ================= -->

    <div id="victoryModal" class="hidden">

        <div class="victory-panel">

            <div class="victory-icon">
                🏆
            </div>

            <h2>
                ¡VICTORIA!
            </h2>

            <div class="victory-line"></div>

            <p class="victory-message">
                ¡Has completado el desafío del clan Uchiha!
            </p>

            <p class="victory-message">
            tus ojos son casi tan fuertes como el sharingan estoy muy sorprendido de que hayas podido completar este desafío, eres un gran ninja
            <p id="victoryStats" class="victory-stats"></p>

            <div class="victory-buttons">

                <button id="victoryRestart">
                    🔄 Jugar de nuevo
                </button>

                <button id="victoryClose">
                    Volver al menú
                </button>

            </div>

        </div>

    </div>


    <!-- ================= BOTÓN VOLVER ================= -->

    <a href="menu.html" class="boton">
        volver
    </a>


 

    <script type="module" src="js/uchiha/Uchiha.js"></script>
</div></div>
<script>function _fitZona(){var c=document.querySelector('.zona-fit-canvas');if(!c)return;c.style.transform='translate(-50%,-50%) scale(1)';var b=c.getBoundingClientRect(),bw=Math.max(b.width,c.scrollWidth||960),bh=Math.max(b.height,c.scrollHeight||700),vw=(window.visualViewport&&window.visualViewport.width)||window.innerWidth,vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight,s=Math.min((vw-4)/bw,(vh-4)/bh);c.style.transform='translate(-50%,-50%) scale('+s+')';}window.addEventListener('resize',_fitZona);window.addEventListener('orientationchange',function(){setTimeout(_fitZona,120);setTimeout(_fitZona,400)});if(window.visualViewport)window.visualViewport.addEventListener('resize',_fitZona);setTimeout(_fitZona,60);setTimeout(_fitZona,350);setTimeout(_fitZona,800);</script>
</body>

</html>
