<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Administrador</title>

<link rel="stylesheet" href="css/mod.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<style>
*{
     background-image:url('gif/fondo.gif');
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0b0b14;
    color:white;
}

.container{
    display:flex;
    height:100vh;
}



.sidebar{
    width:260px;
    background:linear-gradient(180deg,#11000f,#000);
    border-right:2px solid #ff0000;
    padding:20px;
}

.logo{
    text-align:center;
    color:#ff3300;
    margin-bottom:40px;
}

.logo h2{
    margin-top:10px;
}

.menu{
    list-style:none;
}

.menu li{
    padding:15px;
    color:#ff3300;
    cursor:pointer;
    transition:.3s;
}

.menu li:hover{
    background:#1a1a1a;
    border-radius:10px;
}

.menu i{
    width:30px;
}



.main{
    flex:1;
    position:relative;
    background:url("C:\\Users\\FORMACION\\Downloads\\modera\\gif\\fondo2.gif") center/cover no-repeat;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.4);
}

.content{
    position:relative;
    z-index:2;
    padding:20px;
}

/* TOP */

.topbar{
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

.top-btn{
    background:#111827;
    padding:15px;
    border-radius:10px;
}

/* pp */

.profile{
    position:absolute;
    top:90px;
    right:20px;
    background:#1d103d;
    border:2px solid #6d28d9;
    border-radius:15px;
    padding:10px 20px;
    display:flex;
    align-items:center;
    gap:10px;
}

.profile img{
    width:50px;
    height:50px;
    border-radius:50%;
}

/* tarjetas */

.cards{
    margin-top:250px;
    display:flex;
    justify-content:center;
    gap:30px;
}

.card{
    width:220px;
    height:180px;
    border-radius:20px;
    text-align:center;
    padding-top:30px;
    backdrop-filter:blur(5px);
}

.blue{
    border:2px solid #00aaff;
    background:rgba(0,80,255,.15);
}

.purple{
    border:2px solid #a020f0;
    background:rgba(128,0,255,.15);
}

.red{
    border:2px solid #ff0000;
    background:rgba(255,0,0,.15);
}

.card h2{
    margin-bottom:20px;
}

.card i{
    font-size:50px;
    margin-bottom:20px;
}

/* foter */

.status{
    position:absolute;
    bottom:0;
    width:100%;
    background:black;
    display:flex;
    justify-content:space-around;
    padding:10px;
    font-size:14px;
}
</style>
</head>

<body>


<div class="main">

    <video class="video-fondo" autoplay muted loop playsinline>
        <source src="assets/fondo.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="content">
        <!-- Todo tu contenido -->
    </div>

</div>



<div class="container">

    <div class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-shield-halved fa-3x"></i>
            <h2>PANEL <br>de admin</h2>
        </div>

        <ul class="menu">
            <li><i class="fa-solid fa-house"></i> Panel</li>
            <li><i class="fa-solid fa-users"></i> Usuarios</li>
            <li><i class="fa-solid fa-triangle-exclamation"></i> Reportes</li>
            <li><i class="fa-solid fa-ban"></i> Baneos</li>
            <li><i class="fa-solid fa-gear"></i> Configuración</li>
            <li><i class="fa-solid fa-right-from-bracket"></i> Salida</li>
        </ul>
    </div>

    <div class="main">
        <div class="overlay"></div>

        <div class="content">

            <div class="topbar">
                <div class="top-btn"><i class="fa-solid fa-user-group"></i></div>
                <div class="top-btn"><i class="fa-solid fa-bell"></i></div>
                <div class="top-btn"><i class="fa-solid fa-gear"></i></div>
            </div>

            <div class="profile">
                <img src="C:\Users\FORMACION\Downloads\modera\imagenes\itachi_perfil.jpg">
                <div>
                    <strong>Itachi</strong><br>
                    Nivel 25<br>
                    Administrador
                </div>
            </div>

            <div class="cards">

                <div class="card blue">
                    <h2>JUGADORES ONLINE</h2>
                    <i class="fa-solid fa-users"></i>
                    <h3>578</h3>
                </div>

                <div class="card purple">
                    <h2>REPORTES</h2>
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <h3>15</h3>
                </div>

                <div class="card red">
                    <h2>BANEADOS</h2>
                    <i class="fa-solid fa-user-xmark"></i>
                    <h3>10</h3>
                </div>

            </div>

        </div>

        <div class="status">
            <span>🟢 Conectado</span>
            <span>Servidor: Ninja World</span>
            <span>Ping: 45ms</span>
            <span>v1.0.0</span>
        </div>

    </div>

</div>

</body>
</html>
